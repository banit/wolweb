<!doctype html>
<html lang="{{.Lang}}" data-accent="{{.Accent}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>{{.T "reset.title"}} · Wake on LAN</title>
<base href="{{.Base}}">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="{{.ThemeColor}}">
<link rel="stylesheet" href="static/app.css?v={{.Version}}">
<script id="i18n" type="application/json">{{.I18N}}</script>
<script src="static/theme.js?v={{.Version}}"></script>
<script src="static/i18n.js?v={{.Version}}" defer></script>
<script src="static/reset.js?v={{.Version}}" defer></script>
</head>
<body class="wake-page">
{{template "icons"}}
<main class="wake-card login-card">
  <div class="wake-visual static">
    <div class="wake-icon"><svg aria-hidden="true" class="ico"><use href="#i-lock"/></svg></div>
  </div>
  <h1 id="reset-title">{{.T "reset.title"}}</h1>

  <!-- Schritt 1: Link anfordern -->
  <form id="reset-request" class="login-form" method="post" novalidate hidden>
    {{if .MailReset}}
    <p class="muted small">{{.T "reset.request_text"}}</p>
    <label class="field">
      <span>{{.T "login.name"}}</span>
      <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
    </label>
    <p class="form-error" id="reset-request-error" role="alert" tabindex="-1" hidden></p>
    <button type="submit" class="btn btn-primary" id="reset-request-ok"><svg aria-hidden="true" class="ico"><use href="#i-send"/></svg>{{.T "reset.send"}}</button>
    {{else}}
    <p class="muted">{{.T "reset.no_mail"}}</p>
    {{end}}
    <a class="btn btn-ghost" href="login"><svg aria-hidden="true" class="ico"><use href="#i-arrow-left"/></svg>{{.T "reset.back"}}</a>
  </form>
  <p class="notice" id="reset-sent" role="status" tabindex="-1" hidden>{{.T "reset.sent"}}</p>

  <!-- Schritt 2: neues Passwort (Link aus der Mail) -->
  <form id="reset-confirm" class="login-form" method="post" novalidate hidden>
    <p class="muted small">{{.T "reset.confirm_text"}}</p>
    <input type="text" name="username" autocomplete="username" hidden>
    <label class="field">
      <span>{{.T "set.pw.new"}}</span>
      <input type="password" name="password" autocomplete="new-password" maxlength="128" required aria-describedby="reset-hint">
    </label>
    <label class="field">
      <span>{{.T "set.pw.repeat"}}</span>
      <input type="password" name="repeat" autocomplete="new-password" maxlength="128" required aria-describedby="reset-hint">
    </label>
    <small class="muted" id="reset-hint">{{.T "reset.hint"}}</small>
    <p class="form-error" id="reset-confirm-error" role="alert" tabindex="-1" hidden></p>
    <button type="submit" class="btn btn-primary" id="reset-confirm-ok"><svg aria-hidden="true" class="ico"><use href="#i-check"/></svg>{{.T "reset.save"}}</button>
  </form>
</main>
</body>
</html>
