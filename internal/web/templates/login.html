<!doctype html>
<html lang="{{.Lang}}" data-accent="{{.Accent}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{.T "login.title"}} · Wake on LAN</title>
<base href="{{.Base}}">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="static/manifest.json">
<link rel="apple-touch-icon" href="static/icon-180.png">
<meta name="theme-color" content="{{.ThemeColor}}">
<link rel="stylesheet" href="static/app.css?v={{.Version}}">
<script id="i18n" type="application/json">{{.I18N}}</script>
<script src="static/theme.js?v={{.Version}}"></script>
<script src="static/i18n.js?v={{.Version}}" defer></script>
<script src="static/login.js?v={{.Version}}" defer></script>
</head>
<body class="wake-page">
{{template "icons"}}
<main class="wake-card login-card">
  <div class="wake-visual static">
    <div class="wake-icon"><svg aria-hidden="true" class="ico"><use href="#i-power"/></svg></div>
  </div>
  <h1>{{.T "login.title"}}</h1>
  <form id="login-form" class="login-form" method="post" novalidate>
    <label class="field">
      <span>{{.T "login.name"}}</span>
      <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required autofocus>
    </label>
    <label class="field">
      <span>{{.T "login.password"}}</span>
      <input type="password" name="password" autocomplete="current-password" maxlength="128" required>
    </label>
    <p class="form-error" id="login-error" role="alert" tabindex="-1" hidden></p>
    <button type="submit" class="btn btn-primary" id="login-ok"><svg aria-hidden="true" class="ico"><use href="#i-unlock"/></svg>{{.T "login.submit"}}</button>
    <p class="muted small">{{.T "login.forgot"}}</p>
  </form>
</main>
</body>
</html>
