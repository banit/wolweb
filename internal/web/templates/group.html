<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{.T "group.tab.start" .Group.Name}} · Wake on LAN</title>
<base href="{{.Base}}">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icon-180.png">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-title" content="{{.Group.Name}}">
<link rel="stylesheet" href="static/app.css?v={{.Version}}">
<script id="i18n" type="application/json">{{.I18N}}</script>
<script src="static/theme.js?v={{.Version}}"></script>
<script src="static/i18n.js?v={{.Version}}" defer></script>
<script src="static/group.js?v={{.Version}}" defer></script>
</head>
<body class="wake-page">
{{template "icons"}}
<main class="wake-card" id="group" data-name="{{.Group.Name}}" data-path="{{.Group.Path}}" data-key="{{.Key}}"
  data-timeout="{{.Timeout}}" data-retry="{{.Retry}}" data-state="start">
  <div class="wake-visual">
    <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    <div class="wake-icon">
      <svg aria-hidden="true" class="ico dev-ico"><use href="#i-power"/></svg>
      <svg aria-hidden="true" class="ico done-ico" viewBox="0 0 24 24"><path class="check-path" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <svg aria-hidden="true" class="ico warn-ico"><use href="#i-alert"/></svg>
      <svg aria-hidden="true" class="ico sent-ico"><use href="#i-send"/></svg>
    </div>
  </div>
  <h1 id="group-title">{{.T "group.title.starting" .Group.Name}}</h1>
  <p class="muted" id="group-sub">{{.TN "ui.n_devices" (len .Group.Members)}}</p>

  <ul class="members" id="members">
    {{range .Group.Members}}
    <li data-id="{{.ID}}" data-has-ip="{{if .CheckIP}}1{{end}}" data-s="">
      <span class="dev-icon"><svg aria-hidden="true" class="ico"><use href="#i-{{.Icon}}"/></svg></span>
      <div><strong>{{.Name}}</strong><small class="muted" data-detail>{{if .CheckIP}}{{.CheckIP}}{{else}}{{$.T "group.no_ip"}}{{end}}</small></div>
      <span class="pill" data-pill>{{$.T "group.pill.waiting"}}</span>
    </li>
    {{end}}
  </ul>

  <p class="sr-only" id="group-live" role="status"></p>
  <div class="wake-result" id="group-result" hidden></div>

  <div class="wake-actions">
    <a class="btn btn-ghost" href="./"><svg aria-hidden="true" class="ico"><use href="#i-arrow-left"/></svg>{{.T "page.overview"}}</a>
    <button class="btn btn-secondary" id="group-again" hidden><svg aria-hidden="true" class="ico"><use href="#i-refresh"/></svg><span>{{.T "wake.btn.again"}}</span></button>
  </div>
</main>
</body>
</html>
