services:
  wolweb:
    build: .
    image: wolweb:latest
    # Statt selbst zu bauen das fertige Image (amd64, arm64, armv7) eines Releases nehmen:
    # image: ghcr.io/banit/wolweb:latest   – und die Zeile "build: ." entfernen
    container_name: wolweb
    restart: unless-stopped
    # Magic Packets (Broadcast) und ARP-Scan brauchen das Netz des Hosts – Port-Mappings gibt es dann nicht.
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      WOLWEB_PORT: "8089"
      # Gesetzte Variablen haben Vorrang und sind auf der Einstellungsseite gesperrt. Wer Netze und Suche
      # lieber dort pflegt (mit Namen und VLAN), lässt die nächsten beiden Zeilen weg.
      WOLWEB_NETWORKS: "192.168.1.0/24"   # Netze für die Netzwerksuche, kommagetrennt
      WOLWEB_SCAN_INTERVAL: "30m"
      # WOLWEB_BCASTIP: "192.168.1.255:9"      # leer = automatisch (Netz der Geräte-IP bzw. des Suchsegments)
      # WOLWEB_USER: "admin"
      # WOLWEB_PASSWORD: "bitte-ändern"
      # WOLWEB_TOKEN: "langes-zufälliges-token"   # für Home Assistant & Co.
      # WOLWEB_PUBLIC_WAKE: "true"               # feste Wecklinks ohne Anmeldung
      TZ: Europe/Berlin
    volumes:
      # Der Ordner muss root gehören (der Container hat keine Sonderrechte, siehe README):
      # am besten von Docker anlegen lassen, sonst "sudo chown -R root:root data".
      - ./data:/data
      # optional: - ./config.json:/config/config.json:ro
